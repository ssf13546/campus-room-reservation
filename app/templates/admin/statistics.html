{% extends "base.html" %}
{% block title %}统计看板{% endblock %}
{% block content %}
<h3 class="mb-4">统计看板</h3>
<div class="row g-4">
  <div class="col-md-6">
    <div class="card"><div class="card-body" id="chart-count" style="height: 360px;"></div></div>
  </div>
  <div class="col-md-6">
    <div class="card"><div class="card-body" id="chart-usage" style="height: 360px;"></div></div>
  </div>
  <div class="col-md-6">
    <div class="card"><div class="card-body" id="chart-status" style="height: 360px;"></div></div>
  </div>
  <div class="col-md-6">
    <div class="card"><div class="card-body" id="chart-heat" style="height: 360px;"></div></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="{{ url_for('static', filename='js/statistics.js') }}"></script>
{% endblock %}
